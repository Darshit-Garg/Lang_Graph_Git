[project]
name = "lang-graph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Darshit Garg", email = "gargdarshit231@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.4.2",
    "langgraph>=1.2.10",
    "notebook>=7.6.1",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
]

[project.scripts]
lang-graph = "lang_graph:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
